size:10px;line-height:1.6;color:#87907d;margin-bottom:14px}.type{font:11px ui-monospace,monospace;padding:5px 9px;background:#edf2e3;border-radius:4px;color:#647a47;display:inline-block;margin-bottom:22px}dl{margin:0}dl>div{padding:12px 0;border-top:1px solid #e8eadf}dt{font-size:11px;color:#8a9281;margin-bottom:6px}dd{font:13px ui-monospace,monospace;margin:0;overflow-wrap:anywhere}.context{background:#f4f5ed;border-radius:7px;padding:13px;margin-top:18px;font-size:12px;line-height:1.7;color:#68735f}.legend{border-top:1px solid #e5e8de;margin-top:26px;padding-top:20px;font-size:11px;color:#798470}.legend div{margin:12px 0}.swatch{display:inline-block;width:17px;height:3px;vertical-align:middle;margin-right:8px}.notice{font-size:10px;color:#92998b;line-height:1.7;margin-top:23px}#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:800px){header{height:65px;padding:0 15px}.brand strong{font-size:19px}.tag{display:none}.layout{height:calc(100dvh - 65px);grid-template-columns:minmax(0,1fr) 260px}aside{padding:20px 17px}.topbar{left:13px;right:13px;top:15px}.topbar h1{font-size:18px}.toolbar{max-width:150px}.hint{display:none}.bottom{left:13px;right:13px;justify-content:flex-end}}@media(max-width:580px){.layout{grid-template-columns:1fr;grid-template-rows:minmax(350px,60dvh) auto;height:auto}.workspace{min-height:350px}aside{border-left:0;border-top:1px solid #dce1d8;overflow:visible}.panel-label{margin-bottom:15px}.legend{display:none}.brand small{font-size:9px}}

<body>
<header><div class="brand"><span class="logo" aria-hidden="true">❧</span><div><strong>pg_settings_map</strong><small>PostgreSQL · живая карта параметров</small></div></div><span class="tag">Визуальный прототип · 01</span></header>
<main class="layout"><section class="workspace" aria-label="Интерактивная карта"><div class="topbar"><div><p class="eyebrow">Исследуйте настройки</p><h1>Всё связано с деталями.</h1></div><nav class="toolbar" aria-label="Управление картой"><button id="expand">Раскрыть всё</button><button id="reset">Сбросить карту</button></nav></div><div id="canvas"><div id="world"><svg id="edges" aria-hidden="true"></svg><div id="nodes"></div></div></div><div class="bottom"><div class="hint">Тяните узлы — ветки следуют за ними<br>Фон — перемещение · колесо — масштаб · +/− — ветка</div><div class="zoom"><button id="out" aria-label="Уменьшить">−</button><output id="scale">100%</output><button id="in" aria-label="Увеличить">+</button><button id="fit">Вписать</button></div></div></section><aside id="details" aria-label="Справка по выбранному узлу"></aside></main><div id="live" aria-live="polite"></div>
<script>
'use strict';
// Демонстрационная выборка PostgreSQL 17, без пользовательских и серверных значений.
const palette={memory:'#8b9b49',wal:'#bc8560',query:'#7e96b0'};
const data=[
{id:'pg',label:'PostgreSQL',kind:'root',x:0,y:0},
{id:'memory',parent:'pg',label:'Ресурсы и память',kind:'group',branch:'memory',x:-540,y:-275},
{id:'buffers',parent:'memory',label:'Буферы',kind:'subgroup',branch:'memory',x:-870,y:-370},
{id:'shared_buffers',parent:'buffers',label:'shared_buffers',kind:'parameter',branch:'memory',x:-1200,y:-410,type:'integer',default:'16384 × 8 kB (128 MB)',min:'16 × 8 kB',max:'1073741823 × 8 kB',context:'postmaster',description:'Объём памяти, выделяемый сервером для совместно используемых буферов данных.'},
{id:'temp_buffers',parent:'buffers',label:'temp_buffers',kind:'parameter',branch:'memory',x:-1200,y:-330,type:'integer',default:'1024 × 8 kB (8 MB)',min:'100 × 8 kB',max:'1073741823 × 8 kB',context:'user',description:'Максимальный объём буферов для временных таблиц в каждом сеансе. Меняется только до первого использования временных таблиц.'},
{id:'operations',parent:'memory',label:'Рабочая память',kind:'subgroup',branch:'memory',x:-870,y:-170},
{id:'work_mem',parent:'operations',label:'work_mem',kind:'parameter',branch:'memory',x:-1200,y:-210,type:'integer',default:'4096 kB (4 MB)',min:'64 kB',max:'2147483647 kB',context:'user',description:'Базовый лимит памяти для отдельной операции сортировки или хеширования. Несколько операций и сеансов могут расходовать память одновременно.'},
{id:'maintenance_work_mem',parent:'operations',label:'maintenance_work_mem',kind:'parameter',branch:'memory',x:-1200,y:-130,type:'integer',default:'65536 kB (64 MB)',min:'1024 kB',max:'2147483647 kB',context:'user',description:'Максимальный объём памяти для операций обслуживания: VACUUM, CREATE INDEX и других.'},
{id:'wal',parent:'pg',label:'Журнал WAL',kind:'group',branch:'wal',x:450,y:-210},
{id:'durability',parent:'wal',label:'Надёжность',kind:'subgroup',branch:'wal',x:800,y:-310},
{id:'wal_level',parent:'durability',label:'wal_level',kind:'parameter',branch:'wal',x:1110,y:-350,type:'enum',default:'replica',min:'—',max:'—',values:'minimal · replica · logical',context:'postmaster',description:'Определяет объём информации, записываемой в WAL. Уровень logical добавляет сведения для логического декодирования.'},
{id:'fsync',parent:'durability',label:'fsync',kind:'parameter',branch:'wal',x:1110,y:-270,type:'bool',default:'on',min:'—',max:'—',values:'on · off',context:'sighup',description:'Обеспечивает сброс изменений на постоянное хранилище. Отключение может привести к невосстановимому повреждению данных при сбое.'},
{id:'checkpoints',parent:'wal',label:'Контрольные точки',kind:'subgroup',branch:'wal',x:800,y:-110},
{id:'checkpoint_timeout',parent:'checkpoints',label:'checkpoint_timeout',kind:'parameter',branch:'wal',x:1110,y:-150,type:'integer',default:'300 s (5 min)',min:'30 s',max:'86400 s (1 day)',context:'sighup',description:'Максимальное время между автоматическими контрольными точками WAL.'},
{id:'max_wal_size',parent:'checkpoints',label:'max_wal_size',kind:'parameter',branch:'wal',x:1110,y:-70,type:'integer',default:'1024 MB (1 GB)',min:'2 MB',max:'2147483647 MB',context:'sighup',description:'Мягкий предел объёма WAL, после которого запускается автоматическая контрольная точка. Фактический объём может превышать этот предел.'},
{id:'query',parent:'pg',label:'Планирование запросов',kind:'group',branch:'query',x:430,y:240},
{id:'costs',parent:'query',label:'Оценка стоимости',kind:'subgroup',branch:'query',x:800,y:140},
{id:'seq_page_cost',parent:'costs',label:'seq_page_cost',kind:'parameter',branch:'query',x:1110,y:100,type:'real',default:'1',min:'0',max:'≈ 1.7976931348623157e+308',context:'user',description:'Оценка стоимости последовательного чтения одной страницы диска. Используется планировщиком в относительных единицах.'},
{id:'random_page_cost',parent:'costs',label:'random_page_cost',kind:'parameter',branch:'query',x:1110,y:180,type:'real',default:'4',min:'0',max:'≈ 1.7976931348623157e+308',context:'user',description:'Оценка стоимости непоследовательного чтения страницы диска. Влияет на выбор индексного доступа.'},
{id:'methods',parent:'query',label:'Методы планировщика',kind:'subgroup',branch:'query',x:800,y:340},
{id:'enable_hashjoin',parent:'methods',label:'enable_hashjoin',kind:'parameter',branch:'query',x:1110,y:300,type:'bool',default:'on',min:'—',max:'—',values:'on · off',context:'user',description:'Разрешает планировщику использовать соединения по хешу.'},
{id:'enable_nestloop',parent:'methods',label:'enable_nestloop',kind:'parameter',branch:'query',x:1110,y:380,type:'bool',default:'on',min:'—',max:'—',values:'on · off',context:'user',description:'Разрешает соединения вложенным циклом. Полностью исключить такой план невозможно; off лишь делает его менее предпочтительным.'}
];
data.forEach(n=>{n.x*=0.72;});
const byId=new Map(data.map(n=>[n.id,n])), originals=data.map(n=>({id:n.id,x:n.x,y:n.y}));
const children=id=>data.filter(n=>n.parent===id);
const descendants=id=>children(id).flatMap(n=>[n,...descendants(n.id)]);
const canvas=document.querySelector('#canvas'),world=document.querySelector('#world'),nodes=document.querySelector('#nodes'),edges=document.querySelector('#edges');
let selected='work_mem', zoom=1, pan={x:0,y:0}, gesture=null;
function visible(n){return !n.parent||(!byId.get(n.parent).collapsed&&visible(byId.get(n.parent)));}
function transform(){world.style.transform=`translate(${pan.x}px,${pan.y}px) scale(${zoom})`;document.querySelector('#scale').value=Math.round(zoom*100)+'%';}
function render(){
 nodes.replaceChildren();edges.replaceChildren();
 for(const n of data.filter(visible)){
  const el=document.createElement('div');el.className=`node ${n.kind}${selected===n.id?' selected':''}`;el.dataset.id=n.id;el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',n.label);el.setAttribute('aria-pressed',String(selected===n.id));el.style.cssText=`left:${n.x}px;top:${n.y}px;--color:${palette[n.branch]||'#637f48'}`;
  const label=document.createElement('span');label.textContent=n.label;el.append(label);
  if(children(n.id).length){el.setAttribute('aria-expanded',String(!n.collapsed));const b=document.createElement('button');b.className='toggle';b.textContent=n.collapsed?'+':'−';b.setAttribute('aria-label',`${n.collapsed?'Раскрыть':'Свернуть'}: ${n.label}`);b.addEventListener('pointerdown',e=>e.stopPropagation());b.onclick=e=>{e.stopPropagation();n.collapsed=!n.collapsed;render();};el.append(b);}else{const dot=document.createElement('span');dot.className='leaf-dot';el.prepend(dot);}
  el.addEventListener('keydown',e=>{if(e.target!==el)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();select(n.id);render();}if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const dx=e.key==='ArrowLeft'?-15:e.key==='ArrowRight'?15:0,dy=e.key==='ArrowUp'?-15:e.key==='ArrowDown'?15:0;[n,...descendants(n.id)].forEach(v=>{v.x+=dx;v.y+=dy;});position();}});
  nodes.append(el);
 }
 position();
}
function position(){
 for(const el of nodes.children){const n=byId.get(el.dataset.id);el.style.left=n.x+'px';el.style.top=n.y+'px';}
 edges.replaceChildren();
 for(const n of data.filter(n=>n.parent&&visible(n))){const p=byId.get(n.parent),a=nodes.querySelector(`[data-id="${p.id}"]`),b=nodes.querySelector(`[data-id="${n.id}"]`);const right=n.x+b.offsetWidth/2>=p.x+a.offsetWidth/2;const x1=p.x+(right?a.offsetWidth:0),y1=p.y+a.offsetHeight*.8,x2=n.x+(right?0:b.offsetWidth),y2=n.y+b.offsetHeight*.8;const bend=Math.max(35,Math.abs(x2-x1)*.45);const path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('class','edge');path.setAttribute('stroke',palette[n.branch]||'#637f48');path.setAttribute('d',`M${x1},${y1} C${x1+(right?bend:-bend)},${y1} ${x2+(right?-bend:bend)},${y2} ${x2},${y2}`);edges.append(path);}
}
function select(id){selected=id;showDetails();document.querySelectorAll('.node').forEach(el=>{el.classList.toggle('selected',el.dataset.id===id);el.setAttribute('aria-pressed',String(el.dataset.id===id));});}
function showDetails(){
 const n=byId.get(selected),panel=document.querySelector('#details');panel.replaceChildren();
 const add=(tag,text,cls)=>{const el=document.createElement(tag);el.textContent=text;if(cls)el.className=cls;panel.append(el);return el;};
 add('div','Паспорт узла','panel-label');add('div',n.kind==='parameter'?'☷':'❧','panel-icon');
 let trail=[],p=n;while(p.parent){p=byId.get(p.parent);trail.unshift(p.label);}add('div',trail.join(' / '),'breadcrumb');add('h2',n.label);
 if(n.kind==='parameter'){
  add('p',n.description);add('span',n.type,'type');const dl=document.createElement('dl');panel.append(dl);
  const fields=[['По умолчанию',n.default],['Минимум',n.min],['Максимум',n.max],['Контекст',n.context]];if(n.values)fields.push(['Допустимые значения',n.values]);for(const [label,value]of fields){const row=document.createElement('div'),dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;row.append(dt,dd);dl.append(row);}
  add('div',({user:'Можно менять командой SET для текущего сеанса.',sighup:'Требуется перечитать конфигурацию, например через pg_reload_conf().',postmaster:'Для применения требуется перезапуск PostgreSQL.'})[n.context],'context');
 }else{add('p',n.kind==='root'?'Карта настроек PostgreSQL. Раскрывайте ветки, двигайте узлы и выбирайте параметры, чтобы изучить их свойства.':`В этой ветке: ${descendants(n.id).filter(v=>v.kind==='parameter').length} параметра. Перемещение узла переносит всю его ветку; любой дочерний узел можно расположить отдельно.`);const legend=add('div','','legend');for(const [key,label]of [['memory','Ресурсы и память'],['wal','Журнал WAL'],['query','Планирование запросов']]){const row=document.createElement('div'),s=document.createElement('span');s.className='swatch';s.style.background=palette[key];row.append(s,document.createTextNode(label));legend.append(row);}}
 add('div','Демонстрационные данные PostgreSQL 17 для стандартной сборки с блоком 8 kB. Это не значения подключённого сервера. Позиции хранятся только до перезагрузки страницы.','notice');
}
function fit(){const els=[...nodes.children];if(!els.length)return;const left=Math.min(...els.map(e=>byId.get(e.dataset.id).x)),top=Math.min(...els.map(e=>byId.get(e.dataset.id).y)),right=Math.max(...els.map(e=>byId.get(e.dataset.id).x+e.offsetWidth)),bottom=Math.max(...els.map(e=>byId.get(e.dataset.id).y+e.offsetHeight));const w=canvas.clientWidth,h=canvas.clientHeight;zoom=Math.max(.12,Math.min(1,(w-70)/(right-left),(h-180)/(bottom-top)));pan={x:(w-(right-left)*zoom)/2-left*zoom,y:95+(h-170-(bottom-top)*zoom)/2-top*zoom};transform();}
function zoomAt(factor,x=canvas.clientWidth/2,y=canvas.clientHeight/2){const z=Math.max(.12,Math.min(2.5,zoom*factor));pan.x=x-(x-pan.x)*z/zoom;pan.y=y-(y-pan.y)*z/zoom;zoom=z;transform();}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button'))return;const el=e.target.closest('.node'),n=el&&byId.get(el.dataset.id);if(n)select(n.id);gesture={id:e.pointerId,x:e.clientX,y:e.clientY,pan:{...pan},items:n?[n,...descendants(n.id)].map(v=>({n:v,x:v.x,y:v.y})):null};canvas.setPointerCapture(e.pointerId);canvas.classList.add('panning');e.preventDefault();});
canvas.addEventListener('pointermove',e=>{if(!gesture||gesture.id!==e.pointerId)return;const dx=e.clientX-gesture.x,dy=e.clientY-gesture.y;if(gesture.items){for(const v of gesture.items){v.n.x=v.x+dx/zoom;v.n.y=v.y+dy/zoom;}position();}else{pan.x=gesture.pan.x+dx;pan.y=gesture.pan.y+dy;transform();}});
function end(e){if(gesture&&gesture.id===e.pointerId){gesture=null;canvas.classList.remove('panning');}}
canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);canvas.addEventListener('lostpointercapture',end);
canvas.addEventListener('wheel',e=>{e.preventDefault();const r=canvas.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.querySelector('#in').onclick=()=>zoomAt(1.2);document.querySelector('#out').onclick=()=>zoomAt(1/1.2);document.querySelector('#fit').onclick=fit;
document.querySelector('#expand').onclick=()=>{data.forEach(n=>n.collapsed=false);render();fit();};
document.querySelector('#reset').onclick=()=>{for(const p of originals)Object.assign(byId.get(p.id),p,{collapsed:false});render();fit();document.querySelector('#live').textContent='Исходное расположение восстановлено.';};
new ResizeObserver(fit).observe(canvas);render();showDetails();fit();
</script>
</body>
</html>
